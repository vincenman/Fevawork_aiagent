name: Daily HKET News Scraper

on:
  schedule:
    # 8:00 AM Hong Kong (UTC+8) = 0:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TELEGRAM_KEY: ${{ secrets.TELEGRAM_KEY }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run scraper
        working-directory: Class five/Class five
        run: uv run python Web_scaping_20261102.py